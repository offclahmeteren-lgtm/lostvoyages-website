<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formunuz Alındı — Lost Voyages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .ty-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 40px 24px;
      background: #06101a;
    }
    .ty-icon { font-size: 3.5rem; margin-bottom: 20px; }
    .ty-title {
      font-family: 'ReklameScript', cursive;
      font-size: clamp(2rem, 5vw, 3rem);
      color: #D4A017;
      margin-bottom: 16px;
    }
    .ty-text {
      font-size: 0.95rem;
      color: rgba(232,230,225,0.70);
      line-height: 1.7;
      max-width: 480px;
      margin-bottom: 36px;
    }
    .ty-btn {
      display: inline-block;
      background: #D4A017;
      color: #0F1923;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 13px 32px;
      border-radius: 4px;
      transition: background 0.2s, transform 0.2s;
    }
    .ty-btn:hover { background: #e8b82a; transform: translateY(-2px); }
  </style>
</head>
<body>
<nav class="nav scrolled" id="nav">
  <a href="index.html" class="nav-logo">Lost Voyages</a>
</nav>

<div class="ty-wrap">
  <div class="ty-icon">✈️</div>
  <h1 class="ty-title">Formunuz Alındı!</h1>
  <p class="ty-text">
    En kısa sürede sizi arayacağız.<br>
    Sorularınız için WhatsApp'tan da ulaşabilirsiniz.
  </p>
  <a href="index.html" class="ty-btn">Ana Sayfaya Dön</a>
</div>

<script>document.fonts.ready.then(function(){document.documentElement.classList.add('fonts-ready');});</script>
</body>
</html>
